<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background with subtle corner rounding -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />

  <!-- Outer Decorative Scallop / Pico border ring -->
  <circle cx="256" cy="256" r="215" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-dasharray="14 10" opacity="0.6"/>
  <circle cx="256" cy="256" r="195" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.2"/>

  <!-- Inner Badge Circle -->
  <circle cx="256" cy="256" r="170" fill="#064e3b" filter="url(#shadow)" stroke="url(#goldGrad)" stroke-width="5" />

  <!-- Embroidery Thread / Wave motif -->
  <path d="M 120 256 Q 188 200, 256 256 T 392 256" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" opacity="0.4" />

  <!-- Needle and Sewing Thread Art -->
  <g transform="translate(256, 215)" filter="url(#shadow)">
    <!-- Central Needle -->
    <path d="M 0 -75 L 8 40 L 0 80 L -8 40 Z" fill="url(#goldGrad)" stroke="#fef3c7" stroke-width="2" />
    <!-- Needle Eye -->
    <ellipse cx="0" cy="-45" rx="2.5" ry="8" fill="#064e3b" />
    <!-- Golden Thread Swirl -->
    <path d="M 0 -45 C 45 -70, 70 -10, 30 15 C -20 40, -50 0, 0 80" fill="none" stroke="#fef08a" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Typography / Brand Name -->
  <text x="256" y="350" font-family="Arial, 'Segoe UI', sans-serif" font-weight="900" font-size="34" fill="#ffffff" text-anchor="middle" letter-spacing="2">BABA SAIN</text>
  <text x="256" y="385" font-family="Arial, 'Segoe UI', sans-serif" font-weight="700" font-size="20" fill="#fbbf24" text-anchor="middle" letter-spacing="5">PICO SHOP</text>
  <text x="256" y="415" font-family="Arial, 'Segoe UI', sans-serif" font-weight="500" font-size="14" fill="#a7f3d0" text-anchor="middle" letter-spacing="1">THATTA • ESTD</text>
</svg>